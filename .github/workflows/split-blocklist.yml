name: Split HaGeZi tif.mini blocklist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest upstream blocklist
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif.mini.txt \
            -o wildcard/tif.mini.txt

      - name: Split into parts
        run: python3 split_blocklist.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wildcard/tif.mini.txt wildcard/tif.mini.parts/
          if ! git diff --cached --quiet; then
            git commit -m "Update split tif.mini blocklist"
            git push
          fi
